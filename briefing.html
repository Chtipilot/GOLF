<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Briefing d'avant partie — SuarPark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#1a3c34; --green-mid:#2d5c4c; --green-pale:#e8f0ee;
    --sand:#c9a668; --sand-pale:#f1e6cc;
    --flag-red:#b23a3a;
    --cream:#f7f3ea; --line:#e4dfd2; --ink:#26241d; --muted:#6b6558;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

  /* Barre du haut : UNIQUE élément persistant, en dehors des diapositives (jamais dupliqué
     lors de leur régénération), pour éviter tout conflit d'identifiant sur le sélecteur de
     langue. Sa couleur s'adapte simplement selon que la diapositive active est sombre ou non. */
  #topbar {
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding: max(12px, env(safe-area-inset-top)) 20px 10px 20px;
    background:#fff; border-bottom:1px solid var(--line);
  }
  #topbar.dark { background:var(--green-deep); border-bottom-color:rgba(255,255,255,0.15); }
  .brand { font-family:var(--font-display); font-weight:700; font-size:14px; letter-spacing:0.3px; color:var(--green-deep); }
  #topbar.dark .brand { color:var(--sand-pale); }
  .topbar-controls { display:flex; align-items:center; gap:8px; }
  select#langSelect {
    font-size:12px; padding:4px 8px; border-radius:6px; border:1px solid #ccc; background:#fff; color:#222;
  }
  .btn-close {
    font-size:12px; font-weight:bold; padding:6px 12px; border-radius:8px; border:none; cursor:pointer;
    background:var(--flag-red); color:#fff; text-decoration:none; display:inline-block;
  }
  #topbar.dark .btn-close { background:rgba(255,255,255,0.2); }

  #deck { position:fixed; top:52px; left:0; right:0; bottom:60px; overflow:hidden; }
  .slide {
    position:absolute; inset:0; display:none; flex-direction:column;
    padding: 18px 32px;
    background:#fff; color:var(--ink);
  }
  .slide.active { display:flex; }
  .slide.dark { background:var(--green-deep); color:#fff; }

  .kicker { font-size:11px; font-weight:bold; letter-spacing:2px; text-transform:uppercase; color:var(--sand); margin:6px 0 2px 0; }
  .slide.dark .kicker { color:var(--sand); }
  h2.slide-title { font-family:var(--font-display); font-weight:700; font-size:clamp(22px,5.5vw,32px); margin:0 0 14px 0; color:var(--green-deep); }
  .slide.dark h2.slide-title { color:#fff; }

  .content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:10px; }
  .item { display:flex; gap:12px; margin-bottom:16px; align-items:flex-start; }
  .item .num {
    flex:0 0 auto; width:34px; height:34px; border-radius:50%; background:var(--green-deep); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px;
  }
  .item .txt .h { font-weight:bold; color:var(--green-deep); margin-bottom:2px; font-size:15px; }
  .item .txt .b { font-size:13.5px; line-height:1.5; color:var(--ink); }
  .item .txt .b strong { color:var(--green-deep); }

  .title-slide { justify-content:center; align-items:flex-start; }
  .title-slide .kicker2 { font-size:13px; font-weight:bold; letter-spacing:3px; color:var(--sand); margin-bottom:10px; }
  .title-slide h1 { font-family:var(--font-display); font-weight:900; font-size:clamp(30px,7vw,46px); margin:0 0 12px 0; line-height:1.1; }
  .title-slide p.sub { font-size:14px; color:var(--sand-pale); margin:0; }

  .closing-slide { justify-content:center; align-items:center; text-align:center; }
  .closing-slide h1 { font-family:var(--font-display); font-weight:900; font-size:clamp(28px,7vw,42px); margin:14px 0 8px 0; }
  .closing-slide p { font-size:13px; color:var(--sand-pale); max-width:520px; }

  /* Photo réelle du parcours en fond du titre et de la clôture, avec un voile vert
     translucide par-dessus pour garder le texte blanc bien lisible. Le vert plein reste
     défini sur .slide.dark comme repli si l'image ne se charge pas (aucune interruption
     visuelle, juste retour à l'ancien style). */
  .slide.dark.title-slide, .slide.dark.closing-slide {
    background-image: linear-gradient(rgba(26,60,52,0.78), rgba(26,60,52,0.78)), url('golf-course.jpg');
    background-size: cover;
    background-position: center;
  }

  .flag { width:56px; height:56px; }

  .navbar {
    position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:space-between;
    padding: 10px 18px max(10px, env(safe-area-inset-bottom)) 18px; background:rgba(255,255,255,0.94);
    border-top:1px solid var(--line); z-index:10;
  }
  .slide.dark ~ .navbar { }
  .nav-btn {
    border:none; background:var(--green-pale); color:var(--green-deep); font-weight:bold; font-size:18px;
    width:42px; height:42px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .nav-btn:disabled { opacity:0.35; cursor:default; }
  .counter { font-size:12px; color:var(--muted); font-weight:bold; }
</style>
</head>
<body>

<div id="topbar">
  <span class="brand" id="brandText"></span>
  <div class="topbar-controls">
    <select id="langSelect">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="th">ไทย</option>
    </select>
    <a class="btn-close" href="index.html" id="closeLink"></a>
  </div>
</div>

<div id="deck"></div>

<div class="navbar">
  <button class="nav-btn" id="btnPrev" aria-label="Précédent">‹</button>
  <span class="counter" id="counter">1 / 11</span>
  <button class="nav-btn" id="btnNext" aria-label="Suivant">›</button>
</div>

  let lang = "fr";
  let idx = 0;

  function getLangFromURL(){
    const p = new URLSearchParams(window.location.search);
    const l = p.get('lang');
    return (l && CONTENT[l]) ? l : null;
  }

  function itemHTML(it){
    const [num, h, b] = it;
    return `<div class="item">
      <div class="num">${num}</div>
      <div class="txt"><div class="h">${h}</div><div class="b">${b}</div></div>
    </div>`;
  }

  function slideHTML(slide){
    if (slide.type === "title"){
      return `<div class="slide dark title-slide">
        ${FLAG_ICON_DARK}
        <div class="kicker2">${slide.kicker}</div>
        <h1>${slide.title}</h1>
        <p class="sub">${slide.sub}</p>
      </div>`;
    }
    if (slide.type === "closing"){
      return `<div class="slide dark closing-slide">
        ${FLAG_ICON_DARK}
        <h1>${slide.title}</h1>
        <p>${slide.sub}</p>
      </div>`;
    }
    return `<div class="slide">
      <div class="kicker">${slide.kicker}</div>
      <h2 class="slide-title">${slide.title}</h2>
      <div class="content">${slide.items.map(itemHTML).join("")}</div>
    </div>`;
  }

  // Barre du haut : mise à jour en place (jamais régénérée), pour garder le sélecteur de
  // langue et le lien Fermer toujours fonctionnels, quelle que soit la diapositive active.
  function renderTopbar(){
    document.getElementById('brandText').textContent = CONTENT[lang].brand;
    document.getElementById('closeLink').textContent = CONTENT[lang].close;
    const sel = document.getElementById('langSelect');
    sel.value = lang;
    const slides = CONTENT[lang].slides;
    const isDark = slides[idx] && slides[idx].type !== "content";
    document.getElementById('topbar').classList.toggle('dark', isDark);
  }

  function render(){
    const deck = document.getElementById('deck');
    const slides = CONTENT[lang].slides;
    deck.innerHTML = slides.map(slideHTML).join("");
    Array.from(deck.children).forEach((el, i) => { el.classList.toggle('active', i === idx); });
    document.getElementById('counter').textContent = (idx+1) + " / " + slides.length;
    document.getElementById('btnPrev').disabled = (idx === 0);
    document.getElementById('btnNext').disabled = (idx === slides.length - 1);
    renderTopbar();
  }

  function go(delta){
    const max = CONTENT[lang].slides.length - 1;
    idx = Math.max(0, Math.min(max, idx + delta));
    render();
  }

  document.getElementById('btnPrev').addEventListener('click', () => go(-1));
  document.getElementById('btnNext').addEventListener('click', () => go(1));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
  });

  let touchStartX = null;
  document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    touchStartX = null;
  }, {passive:true});

  document.getElementById('langSelect').addEventListener('change', (e) => {
    lang = e.target.value;
    render();
  });

  const urlLang = getLangFromURL();
  if (urlLang) lang = urlLang;
  render();
})();
