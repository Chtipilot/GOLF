function getLang(){
  const params = new URLSearchParams(window.location.search);
  const l = params.get('lang');
  return T[l] ? l : 'fr';
}

function renderEraHTML(era){
  let html = `<div class="era"><span class="badge">${era.badge}</span><h2>${era.title}</h2><p>${era.p}</p>`;
  if (era.li){
    html += '<ul>' + era.li.map(x => `<li>${x}</li>`).join('') + '</ul>';
  }
  if (era.milestone){
    html += `<div class="milestone">${era.milestone}</div>`;
  }
  html += '</div>';
  return html;
}

function render(lang){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('pageTitle').textContent = 'GOLF_TEAM — Historique_Site';
  document.getElementById('backLink').textContent = t.backLink;
  document.getElementById('h1Title').textContent = t.h1;
  document.getElementById('introSubtitle').textContent = t.intro;
  document.getElementById('dateStamp').innerHTML = t.dateStamp;
  document.getElementById('content').innerHTML = t.eras.map(renderEraHTML).join('');
  document.getElementById('closingLine').textContent = t.closing;
  document.getElementById('footerLine').innerHTML = t.footer;
  document.querySelectorAll('#langSwitch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

document.querySelectorAll('#langSwitch button').forEach(b => {
  b.addEventListener('click', () => {
    const url = new URL(window.location);
    url.searchParams.set('lang', b.dataset.lang);
    window.history.replaceState({}, '', url);
    render(b.dataset.lang);
  });
});

render(getLang());
</script>
