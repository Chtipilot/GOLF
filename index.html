<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carnet de la Boulangerie</title>
<style>
  :root{
    --cream:#FAF5EA;
    --paper:#FFFDF8;
    --walnut:#3A2A1D;
    --walnut-soft:#6B5642;
    --wheat:#C69A48;
    --rust:#A24A1F;
    --sage:#5C6B4A;
    --line:#E7DAC3;
    --shadow: 0 2px 10px rgba(58,42,29,0.08);
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Noto Serif Thai', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Thai', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--walnut);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:78px;
  }

  /* ---- top bar ---- */
  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--walnut);
    color:var(--cream);
    padding:14px 16px 12px;
    box-shadow:var(--shadow);
  }
  header.top .brand{
    display:flex; align-items:flex-start; gap:10px;
  }
  header.top svg{flex:none;}
  header.top h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:15.5px;
    line-height:1.25;
    margin:0;
    letter-spacing:0.1px;
  }
  header.top p.sub{
    margin:3px 0 0;
    font-size:10.5px;
    line-height:1.4;
    color:#D9C9A8;
    letter-spacing:0.2px;
  }
  .version-badge{
    flex:none;
    align-self:center;
    font-size:10.5px;
    font-weight:600;
    color:var(--walnut);
    background:var(--wheat);
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
    margin-left:auto;
    cursor:pointer;
  }

  /* ---- language toggle ---- */
  .lang-toggle{
    display:flex;
    margin-top:12px;
    background:rgba(255,255,255,0.08);
    border-radius:999px;
    padding:3px;
    gap:3px;
  }
  .lang-toggle button{
    flex:1;
    border:none;
    background:transparent;
    color:#D9C9A8;
    font-family:var(--font-body);
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.4px;
    padding:7px 0;
    border-radius:999px;
    cursor:pointer;
  }
  .lang-toggle button.active{
    background:var(--wheat);
    color:var(--walnut);
  }

  /* ---- content ---- */
  main{
    padding:16px 14px 24px;
    max-width:560px;
    margin:0 auto;
  }
  .panel{display:none;}
  .panel.active{display:block;}

  /* Inventaire */
  .inv-note{
    font-size:12.5px;
    color:var(--walnut-soft);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:14px;
  }
  .inv-cat{
    font-family:var(--font-display);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--rust);
    margin:20px 0 8px;
  }
  .inv-cat:first-of-type{margin-top:0;}
  .inv-item{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:9px;
    box-shadow:var(--shadow);
  }
  .inv-item h3{
    font-family:var(--font-display);
    font-size:15.5px;
    margin:0 0 2px;
  }
  .inv-item .brand-tag{
    font-size:11.5px;
    color:var(--walnut-soft);
    margin-bottom:6px;
  }
  .inv-item .row{
    display:flex;
    font-size:12.5px;
    padding:3px 0;
    border-top:1px dashed var(--line);
  }
  .inv-item .row:first-of-type{border-top:none; padding-top:6px;}
  .inv-item .row .k{
    width:100px;
    flex:none;
    color:var(--sage);
    font-weight:600;
  }
  .inv-item .row .v{color:var(--walnut);}
  .inv-item .row.sub{background:rgba(212,163,63,0.12); border-radius:6px; margin-top:2px; padding:5px 6px; border-top:none;}
  .inv-item .row.sub .k{color:var(--amber, #b5842a); width:auto; margin-right:6px;}

  /* Liste de courses — texte volontairement grand, lisible sans lunettes */
  .courses-savebar{ margin-bottom:8px; }
  .courses-saved-info{
    font-size:13px;
    color:var(--walnut-soft);
    font-style:italic;
  }
  .courses-actions{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .courses-action-btn{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--walnut);
    font-size:13px;
    font-weight:600;
    padding:10px 8px;
    border-radius:10px;
    cursor:pointer;
  }
  .courses-cat{
    font-family:var(--font-display);
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--rust);
    margin:24px 0 10px;
  }
  .courses-cat:first-of-type{margin-top:0;}
  .courses-item{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .courses-item.checked{
    background:rgba(92,107,74,0.12);
    border-color:var(--sage);
  }
  .courses-item .courses-check{
    flex:none;
    width:34px;
    height:34px;
    border-radius:9px;
    border:2.5px solid var(--sage);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    color:var(--sage);
    cursor:pointer;
    background:white;
  }
  .courses-item.checked .courses-check{
    background:var(--sage);
    color:white;
  }
  .courses-item .courses-info{
    flex:1;
    min-width:0;
  }
  .courses-item .courses-name{
    font-family:var(--font-display);
    font-size:19px;
    line-height:1.25;
    font-weight:700;
    color:var(--walnut);
  }
  .courses-item.checked .courses-name{
    text-decoration:line-through;
    color:var(--walnut-soft);
  }
  .courses-item .courses-qty{
    font-size:15.5px;
    color:var(--rust);
    font-weight:600;
    margin-top:2px;
  }
  .courses-item .courses-del{
    flex:none;
    width:30px;
    height:30px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--walnut-soft);
    font-size:18px;
    cursor:pointer;
  }
  .courses-add-row{
    display:flex;
    gap:8px;
    margin-top:22px;
    padding-top:16px;
    border-top:2px dashed var(--line);
  }
  .courses-add-input{
    flex:1;
    font-size:16px;
    padding:12px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:white;
    color:var(--walnut);
    font-family:var(--font-body);
  }
  .courses-add-qty{
    width:70px;
    font-size:16px;
    padding:12px 8px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:white;
    color:var(--walnut);
    font-family:var(--font-body);
  }
  .courses-add-btn{
    flex:none;
    background:var(--wheat);
    color:var(--walnut);
    border:none;
    font-weight:700;
    font-size:14.5px;
    padding:0 16px;
    border-radius:10px;
    cursor:pointer;
  }
  .courses-bottom-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
  }
  .courses-bottom-actions > *{ flex:1 1 100px; }
  .courses-save-btn, .courses-share-btn{
    flex:1;
    font-size:15px;
    font-weight:700;
    padding:14px 8px;
    border-radius:12px;
    border:none;
    cursor:pointer;
  }
  .courses-save-btn{
    background:var(--sage);
    color:white;
  }
  .courses-share-btn{
    background:var(--walnut);
    color:var(--cream);
  }
  .courses-print-btn{
    flex:1;
    font-size:15px;
    font-weight:700;
    padding:14px 8px;
    border-radius:12px;
    border:1.5px solid var(--walnut);
    background:white;
    color:var(--walnut);
    cursor:pointer;
  }
  .courses-name-th{
    font-weight:400;
    color:var(--walnut-soft);
    font-size:16px;
  }
  @media print{
    header, nav.bottom, .courses-savebar, .courses-actions,
    .courses-add-row, .courses-bottom-actions, .courses-item .courses-del,
    .modal-backdrop, .courses-toast{
      display:none !important;
    }
    #panel-courses{ display:block !important; }
    body{ background:white; }
    .courses-item{ box-shadow:none; border:1px solid #ccc; break-inside:avoid; }
    .courses-check{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
  .courses-history-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .courses-history-row .chr-date{
    flex:1;
    font-size:14.5px;
    font-weight:600;
    color:var(--walnut);
  }
  .courses-history-row .chr-count{
    font-size:12px;
    color:var(--walnut-soft);
    display:block;
    font-weight:400;
    margin-top:2px;
  }
  .courses-history-row button{
    font-size:12.5px;
    font-weight:600;
    padding:7px 10px;
    border-radius:8px;
    border:none;
    cursor:pointer;
  }
  .courses-history-row .chr-load{ background:var(--sage); color:white; }
  .courses-history-row .chr-del{ background:transparent; color:var(--rust); }
  .courses-toast{
    position:fixed;
    left:50%; bottom:90px;
    transform:translateX(-50%);
    background:var(--walnut);
    color:var(--cream);
    padding:10px 18px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    box-shadow:var(--shadow);
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
  }
  .courses-toast.show{ opacity:1; }

  /* Recipe header */
  .recipe-hero{
    font-family:var(--font-display);
    font-size:21px;
    font-weight:700;
    margin:0 0 3px;
    color:var(--walnut);
  }
  .recipe-tag{
    font-size:12px;
    color:var(--walnut-soft);
    margin:0 0 16px;
  }
  .recipe-photo{
    width:100%;
    aspect-ratio:16/10;
    object-fit:cover;
    border-radius:14px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
    display:block;
  }

  /* quantity stepper */
  .stepper-card{
    background:linear-gradient(135deg,#FFFCF6,var(--paper));
    border:1px solid var(--wheat);
    border-radius:14px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:var(--shadow);
    margin-bottom:18px;
  }
  .stepper-card .label{
    font-size:12.5px;
    color:var(--walnut-soft);
    max-width:150px;
    line-height:1.35;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:0;
    background:var(--cream);
    border-radius:10px;
    border:1px solid var(--line);
  }
  .stepper button{
    width:36px;height:36px;
    border:none;
    background:transparent;
    color:var(--rust);
    font-size:19px;
    font-weight:700;
    cursor:pointer;
  }
  .stepper input{
    width:44px;
    text-align:center;
    border:none;
    background:transparent;
    font-family:var(--font-display);
    font-size:18px;
    font-weight:700;
    color:var(--walnut);
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  /* ingredients */
  .section-label{
    font-family:var(--font-display);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--rust);
    margin:22px 0 8px;
  }
  .ing-list{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .ing-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 14px;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .ing-row:last-child{border-bottom:none;}
  .ing-row .name{
    font-size:14px;
    line-height:1.3;
  }
  .ing-row .name small{
    display:block;
    font-size:11px;
    color:var(--wheat);
    margin-top:2px;
    font-weight:600;
  }
  .ing-row .qty{
    flex:none;
    text-align:right;
    font-family:var(--font-display);
    font-weight:700;
    font-size:16px;
    color:var(--rust);
    white-space:nowrap;
  }
  .ing-sub-legend{
    font-size:11.5px;
    color:var(--sage);
    font-style:italic;
    margin:6px 2px 0;
  }
  .ing-row .qty .unit{
    font-family:var(--font-body);
    font-weight:500;
    font-size:11.5px;
    color:var(--walnut-soft);
    margin-left:2px;
  }

  /* equipment */
  .eq-list{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px 14px;
    box-shadow:var(--shadow);
  }
  .eq-list li{
    font-size:13px;
    padding:8px 0;
    border-bottom:1px dashed var(--line);
    list-style:none;
  }
  .eq-list li:last-child{border-bottom:none;}

  /* nutrition table */
  .nutri-table{
    width:100%;
    border-collapse:collapse;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    box-shadow:var(--shadow);
    font-size:13px;
  }
  .nutri-table thead th{
    font-family:var(--font-display);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--wheat);
    background:#F1EAD9;
    padding:8px 10px;
    text-align:right;
    font-weight:700;
  }
  .nutri-table thead th:first-child{text-align:left;}
  .nutri-table td{
    padding:7px 10px;
    border-bottom:1px solid var(--line);
    text-align:right;
    white-space:nowrap;
  }
  .nutri-table td:first-child{
    text-align:left;
    white-space:normal;
    color:var(--walnut);
  }
  .nutri-table td.sub{
    padding-left:20px;
    font-size:12px;
    color:var(--walnut-soft);
    font-style:italic;
  }
  .nutri-table tr:last-child td{border-bottom:none;}

  /* about page */
  .about-quotes{
    margin:14px 0;
    padding-left:14px;
    border-left:3px solid var(--wheat);
  }
  .about-quote{
    font-style:italic;
    color:var(--walnut-soft);
    margin:6px 0;
    line-height:1.5;
  }
  .about-block{margin:10px 0 16px;}
  .about-line{
    margin:6px 0;
    line-height:1.5;
    color:var(--walnut);
  }
  .about-list{
    margin:8px 0 16px;
    padding-left:22px;
    line-height:1.6;
    color:var(--walnut);
  }
  .about-list li{margin-bottom:8px;}
  .about-closing{
    text-align:center;
    font-weight:700;
    color:var(--rust);
    font-family:var(--font-display);
    font-size:16px;
    margin:20px 0 10px;
    padding:14px;
    background:#F1EAD9;
    border-radius:12px;
  }

  /* steps */
  .steps{
    padding:0; margin:0;
  }
  .steps li{
    list-style:none;
    counter-increment:step;
    position:relative;
    padding:0 0 16px 34px;
    font-size:13.5px;
    line-height:1.5;
    color:var(--walnut);
  }
  .steps li.head{
    font-weight:700;
    font-family:var(--font-display);
    font-size:14.5px;
    color:var(--sage);
    padding-left:0;
    margin-top:10px;
    counter-increment:none;
  }
  .steps li.head:first-child{margin-top:0;}
  .steps li:not(.head)::before{
    content: counter(step);
    position:absolute;
    left:0; top:0;
    width:24px;height:24px;
    background:var(--wheat);
    color:var(--walnut);
    font-family:var(--font-display);
    font-weight:700;
    font-size:12px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }

  .note{
    margin-top:16px;
    font-size:12.5px;
    color:var(--walnut-soft);
    background:#F1EAD9;
    border-left:3px solid var(--wheat);
    padding:10px 12px;
    border-radius:6px;
    line-height:1.5;
  }
  .note.key{border-left-color:var(--rust);}

  /* ---- modal historique des versions ---- */
  .modal-backdrop{
    display:none;
    position:fixed; inset:0; z-index:50;
    background:rgba(58,42,29,0.45);
    padding:20px;
    align-items:flex-end;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--paper);
    border-radius:16px 16px 12px 12px;
    padding:18px 18px 20px;
    width:100%;
    max-width:520px;
    margin:0 auto;
    box-shadow:0 -4px 20px rgba(0,0,0,0.2);
  }
  .modal h2{
    font-family:var(--font-display);
    font-size:16px;
    margin:0 0 12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .modal h2 button{
    background:var(--cream);
    border:none;
    width:26px;height:26px;
    border-radius:50%;
    color:var(--walnut-soft);
    font-size:14px;
    cursor:pointer;
  }
  .changelog-entry{
    border-top:1px solid var(--line);
    padding:10px 0;
    font-size:12.5px;
    line-height:1.5;
  }
  .changelog-entry:first-of-type{border-top:none;}
  .changelog-entry .v{
    font-family:var(--font-display);
    font-weight:700;
    color:var(--rust);
    margin-right:6px;
  }
  .changelog-entry .d{color:var(--walnut-soft);}

  /* ---- bottom nav ---- */
  nav.bottom{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--paper);
    border-top:1px solid var(--line);
    display:flex;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(58,42,29,0.08);
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  nav.bottom::-webkit-scrollbar{display:none;}
  nav.bottom button{
    flex:0 0 auto;
    min-width:60px;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px 8px;
    color:var(--walnut-soft);
    font-family:var(--font-body);
    font-size:10px;
    font-weight:600;
    cursor:pointer;
    border-radius:10px;
    white-space:nowrap;
  }
  nav.bottom button .ico{font-size:17px;line-height:1;}
  nav.bottom button .ico img{
    width:20px;height:20px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:1.5px solid transparent;
  }
  nav.bottom button.active .ico img{border-color:var(--rust);}
  nav.bottom button.active{color:var(--rust);}
  nav.bottom button.active .ico{transform:translateY(-1px);}

  /* ---- mode cuisine (bouton + overlay) ---- */
  .cook-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    width:100%;
    background:var(--walnut);
    color:var(--cream);
    border:none;
    border-radius:12px;
    padding:12px 14px;
    font-family:var(--font-body);
    font-size:13.5px;
    font-weight:700;
    letter-spacing:0.2px;
    cursor:pointer;
    box-shadow:var(--shadow);
    margin-bottom:18px;
  }
  .cook-btn .ic{font-size:16px;}

  /* body.cook-mode-active masque complètement l'en-tête et la nav principale
     pour que le Mode Cuisine occupe tout l'écran, sans dépendre du plein écran natif */
  body.cook-mode-active{overflow:hidden;}
  body.cook-mode-active header.top,
  body.cook-mode-active nav.bottom{display:none;}

  .cook-overlay{
    display:none;
    position:fixed; inset:0; z-index:60;
    background:var(--walnut);
    color:var(--cream);
    --cook-scale:1;
    height:100vh;
    height:100dvh;
  }
  .cook-overlay.show{display:flex; flex-direction:column;}
  .cook-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
    padding:14px 16px calc(10px + env(safe-area-inset-top)) 16px;

    font-size:16px;

    steps:{
      fr:[
        {t:"Préparer le bœuf", d:"Couper la viande en gros morceaux de 4–5 cm et bien l'éponger."},
        {t:"Faire revenir les lardons", d:"Dans une cocotte, faire revenir les lardons 4–5 min. Les retirer et réserver."},
        {t:"Colorer la viande", d:"Ajouter l'huile et saisir les morceaux de bœuf en plusieurs fois. Ils doivent être bien dorés. Réserver."},
        {t:"Faire revenir les légumes", d:"Mettre les oignons et les carottes dans la cocotte. Faire revenir environ 5 min. Ajouter l'ail."},
        {t:"Singer", d:"Remettre la viande et saupoudrer avec 2 c. à soupe de farine. Mélanger et cuire 1–2 min."},
        {t:"Mouiller au vin", d:"Verser les 75 cl de vin rouge, puis le bouillon. Ajouter le bouquet garni, les lardons, un peu de sel et du poivre."},
        {t:"Mijoter", d:"Porter à frémissement, puis couvrir et cuire à feu très doux pendant 2 h 30 à 3 h. La viande doit être extrêmement tendre."},
        {t:"Ajouter les champignons", d:"Faire revenir les champignons séparément dans le beurre pendant 5–7 min. Les ajouter au bourguignon 30 min avant la fin."},
        {t:"Rectifier la sauce", d:"Retirer le bouquet garni. Goûter et ajuster sel et poivre. Si la sauce est trop liquide, laisser réduire quelques minutes à découvert."},
      ],
      en:[
        {t:"Prepare the beef", d:"Cut the meat into large 4–5 cm chunks and pat dry thoroughly."},
        {t:"Brown the bacon lardons", d:"In a Dutch oven, brown the bacon lardons for 4–5 minutes. Remove and set aside."},
        {t:"Brown the meat", d:"Add the oil and sear the beef chunks in batches. They should be nicely browned. Set aside."},
        {t:"Sauté the vegetables", d:"Put the onions and carrots in the pot. Sauté for about 5 minutes. Add the garlic."},
        {t:"Add the flour", d:"Return the meat to the pot and sprinkle with 2 tbsp of flour. Stir and cook for 1–2 minutes."},
        {t:"Add the wine", d:"Pour in the 75 cl of red wine, then the stock. Add the bouquet garni, the lardons, a little salt and pepper."},
        {t:"Simmer", d:"Bring to a simmer, then cover and cook over very low heat for 2h30 to 3 hours. The meat should be extremely tender."},
        {t:"Add the mushrooms", d:"Sauté the mushrooms separately in the butter for 5–7 minutes. Add them to the bourguignon 30 minutes before the end of cooking."},
        {t:"Adjust the sauce", d:"Remove the bouquet garni. Taste and adjust salt and pepper. If the sauce is too thin, let it reduce uncovered for a few minutes."},
      ],
      de:[
        {t:"Das Rindfleisch vorbereiten", d:"Das Fleisch in grobe Stücke von 4–5 cm schneiden und gut trockentupfen."},
        {t:"Speckwürfel anbraten", d:"Die Speckwürfel in einem Schmortopf 4–5 Minuten anbraten. Herausnehmen und beiseitestellen."},
        {t:"Das Fleisch anbraten", d:"Das Öl hinzufügen und die Rindfleischstücke portionsweise scharf anbraten. Sie sollten schön braun sein. Beiseitestellen."},
        {t:"Das Gemüse anbraten", d:"Die Zwiebeln und Karotten in den Topf geben. Etwa 5 Minuten anbraten. Den Knoblauch hinzufügen."},
        {t:"Mehlieren", d:"Das Fleisch zurück in den Topf geben und mit 2 EL Mehl bestäuben. Umrühren und 1–2 Minuten kochen."},
        {t:"Mit Wein ablöschen", d:"Die 75 cl Rotwein und anschließend die Brühe angießen. Bouquet garni, Speckwürfel, etwas Salz und Pfeffer hinzufügen."},
        {t:"Schmoren", d:"Zum Köcheln bringen, dann zugedeckt bei sehr niedriger Hitze 2,5 bis 3 Stunden garen. Das Fleisch sollte extrem zart sein."},
        {t:"Die Pilze hinzufügen", d:"Die Champignons separat 5–7 Minuten in der Butter anbraten. 30 Minuten vor Ende der Garzeit zum Bourguignon geben."},
        {t:"Die Sauce abschmecken", d:"Das Bouquet garni entfernen. Abschmecken und Salz und Pfeffer anpassen. Falls die Sauce zu flüssig ist, einige Minuten offen einkochen lassen."},

    steps:{
      fr:[
        {t:"Blanchir le veau", d:"Mettre le veau dans une grande casserole, couvrir largement d'eau froide. Porter à ébullition et laisser bouillir 3 minutes. Égoutter la viande et la rincer rapidement à l'eau — cette étape permet d'obtenir une sauce bien blanche."},
        {t:"Cuire le veau", d:"Mettre le veau dans une grande cocotte avec les carottes, l'oignon coupé en deux, l'ail, le laurier, le thym, le persil, le cube de bouillon et environ 1 litre d'eau (le liquide doit juste couvrir la viande). Porter à ébullition puis réduire immédiatement à feu très doux. Couvrir et cuire 1 h 30 à 2 h, jusqu'à ce que la viande soit très tendre."},
        {t:"Préparer les champignons", d:"Pendant ce temps, couper les champignons en quartiers. Faire fondre 20 g de beurre dans une poêle, ajouter les champignons et cuire 5 à 7 minutes. Réserver."},
        {t:"Préparer la sauce blanche", d:"Lorsque le veau est cuit, retirer la viande et les carottes. Conserver environ 600 ml du bouillon de cuisson. Dans une casserole, faire fondre 20 g de beurre, ajouter 40 g de farine et mélanger environ 1 minute (la farine doit rester blanche, sans brunir). Ajouter progressivement le bouillon en fouettant, puis cuire 5 à 8 minutes jusqu'à obtenir une sauce légèrement épaisse."},
        {t:"Ajouter la crème", d:"Ajouter la crème et mélanger doucement. Ajouter ensuite le veau, les carottes et les champignons. Laisser mijoter 10 minutes à feu très doux."},
        {t:"Lier la sauce (jaune d'œuf et citron)", d:"Dans un bol, mélanger le jaune d'œuf avec 1 à 2 cuillères à soupe de jus de citron. Ajouter progressivement 2 à 3 cuillères de sauce chaude en fouettant, puis verser ce mélange dans la cocotte. À partir de ce moment, ne plus faire bouillir : la sauce doit simplement rester chaude. Goûter et ajuster sel, poivre et citron."},
      ],
      en:[
        {t:"Blanch the veal", d:"Put the veal in a large pot, cover generously with cold water. Bring to a boil and boil for 3 minutes. Drain the meat and rinse it quickly under water — this step is what gives the sauce its clean white color."},
        {t:"Cook the veal", d:"Put the veal in a large pot with the carrots, the onion cut in half, the garlic, bay leaves, thyme, parsley, the stock cube and about 1 liter of water (the liquid should just cover the meat). Bring to a boil, then immediately reduce to very low heat. Cover and cook for 1h30 to 2 hours, until the meat is very tender."},
        {t:"Prepare the mushrooms", d:"Meanwhile, cut the mushrooms into quarters. Melt 20 g of butter in a pan, add the mushrooms and cook for 5 to 7 minutes. Set aside."},
        {t:"Prepare the white sauce", d:"Once the veal is cooked, remove the meat and carrots. Keep about 600 ml of the cooking broth. In a saucepan, melt 20 g of butter, add 40 g of flour and stir for about 1 minute (the flour should stay white, without browning). Gradually whisk in the broth, then cook for 5 to 8 minutes until you get a slightly thickened sauce."},
        {t:"Add the cream", d:"Add the cream and stir gently. Then add the veal, carrots and mushrooms. Let simmer for 10 minutes over very low heat."},
        {t:"Finish the sauce (egg yolk and lemon)", d:"In a bowl, whisk the egg yolk with 1 to 2 tablespoons of lemon juice. Gradually whisk in 2 to 3 spoonfuls of hot sauce, then pour this mixture into the pot. From this point on, do not let it boil: the sauce should just stay warm. Taste and adjust salt, pepper and lemon."},
      ],
      de:[
        {t:"Das Kalbfleisch blanchieren", d:"Das Kalbfleisch in einen großen Topf geben und reichlich mit kaltem Wasser bedecken. Zum Kochen bringen und 3 Minuten kochen lassen. Das Fleisch abgießen und kurz unter Wasser abspülen — dieser Schritt sorgt für eine schön weiße Sauce."},
        {t:"Das Kalbfleisch garen", d:"Das Kalbfleisch mit den Karotten, der halbierten Zwiebel, dem Knoblauch, Lorbeer, Thymian, Petersilie, dem Brühwürfel und etwa 1 Liter Wasser (die Flüssigkeit sollte das Fleisch gerade bedecken) in einen großen Schmortopf geben. Zum Kochen bringen und sofort auf sehr niedrige Hitze reduzieren. Zugedeckt 1,5 bis 2 Stunden garen, bis das Fleisch sehr zart ist."},
        {t:"Die Pilze vorbereiten", d:"In der Zwischenzeit die Champignons vierteln. 20 g Butter in einer Pfanne schmelzen, die Champignons hinzufügen und 5 bis 7 Minuten braten. Beiseitestellen."},
        {t:"Die weiße Sauce vorbereiten", d:"Sobald das Kalbfleisch gar ist, Fleisch und Karotten herausnehmen. Etwa 600 ml der Garflüssigkeit aufbewahren. In einem Topf 20 g Butter schmelzen, 40 g Mehl hinzufügen und etwa 1 Minute rühren (das Mehl sollte weiß bleiben, ohne zu bräunen). Nach und nach die Brühe einrühren, dann 5 bis 8 Minuten kochen, bis die Sauce leicht eindickt."},
        {t:"Die Sahne hinzufügen", d:"Die Sahne hinzufügen und vorsichtig verrühren. Anschließend Kalbfleisch, Karotten und Champignons hinzufügen. 10 Minuten bei sehr niedriger Hitze köcheln lassen."},
        {t:"Die Sauce abziehen (Eigelb und Zitrone)", d:"In einer Schüssel das Eigelb mit 1 bis 2 Esslöffeln Zitronensaft verquirlen. Nach und nach 2 bis 3 Löffel heiße Sauce einrühren, dann diese Mischung in den Topf geben. Ab diesem Zeitpunkt nicht mehr kochen lassen: die Sauce soll nur noch heiß bleiben. Abschmecken und Salz, Pfeffer und Zitrone anpassen."},
      ],
      th:[
        {t:"ลวกเนื้อลูกวัว", d:"ใส่เนื้อลูกวัวลงในหม้อใบใหญ่ เติมน้ำเย็นให้ท่วม ตั้งไฟจนเดือดแล้วต้มต่อ 3 นาที เทน้ำทิ้งแล้วล้างเนื้อเร็ว ๆ ด้วยน้ำ — ขั้นตอนนี้ช่วยให้ซอสมีสีขาวสวย"},
        {t:"ต้มเนื้อลูกวัว", d:"ใส่เนื้อลูกวัวลงในหม้อใบใหญ่พร้อมแครอท หัวหอมผ่าครึ่ง กระเทียม ใบกระวาน ไธม์ พาร์สลีย์ ก้อนซุปไก่ และน้ำประมาณ 1 ลิตร (น้ำควรท่วมเนื้อพอดี) ตั้งไฟจนเดือดแล้วลดไฟลงต่ำสุดทันที ปิดฝาแล้วเคี่ยว 1 ชั่วโมง 30 นาที ถึง 2 ชั่วโมง จนเนื้อนุ่มมาก"},
        {t:"เตรียมเห็ด", d:"ระหว่างรอ หั่นเห็ดเป็นชิ้นสี่เสี้ยว ละลายเนย 20 กรัมในกระทะ ใส่เห็ดแล้วผัด 5-7 นาที พักไว้"},
        {t:"เตรียมซอสขาว", d:"เมื่อเนื้อสุกแล้ว ตักเนื้อและแครอทออก เก็บน้ำต้ม (สต็อก) ไว้ประมาณ 600 มล. ในหม้อ ละลายเนย 20 กรัม ใส่แป้ง 40 กรัม คนประมาณ 1 นาที (แป้งต้องยังคงสีขาว ไม่ให้เป็นสีน้ำตาล) ค่อย ๆ ใส่น้ำสต็อกลงไปพร้อมคนตลอด แล้วเคี่ยว 5-8 นาทีจนซอสข้นขึ้นเล็กน้อย"},
        {t:"ใส่ครีม", d:"ใส่ครีมแล้วคนเบา ๆ จากนั้นใส่เนื้อ แครอท และเห็ดกลับลงไป เคี่ยวไฟอ่อนมาก 10 นาที"},
        {t:"ปรุงซอสให้ข้น (ไข่แดงและมะนาว)", d:"ในชาม ผสมไข่แดงกับน้ำมะนาว 1-2 ช้อนโต๊ะ ค่อย ๆ ใส่ซอสร้อน 2-3 ช้อนลงไปพร้อมคนตลอด แล้วเทส่วนผสมนี้กลับลงในหม้อ นับจากนี้ห้ามต้มอีก ซอสควรอุ่นเท่านั้น ชิมรสแล้วปรับเกลือ พริกไทย และมะนาวตามชอบ"},
      ],
    },

/* ===================== FORMAT NOMBRE ===================== */
function fmt(n){
  const r = Math.round(n*10)/10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1).replace(/\.0$/,"");
}

/* ===================== RENDU RECETTE ===================== */
function renderRecipe(key){
  const r = recipes[key];
  const lang = currentLang;
  const factor = desired[key] / r.baseCount;
  const panel = document.getElementById("panel-"+key);

  let html = `
    <h2 class="recipe-hero">${r.title[lang]}</h2>
    <p class="recipe-tag">${r.tag[lang]}</p>
    ${r.photo ? `<img class="recipe-photo" src="${r.photo}" alt="${r.title[lang]}">` : ""}
    <div class="stepper-card">
      <div class="label">${r.unitLabel[lang]}</div>
      <div class="stepper">
        <button data-act="minus" data-key="${key}">−</button>
        <input type="number" id="input-${key}" value="${desired[key]}" min="${r.min}" step="${r.step}" data-key="${key}">
        <button data-act="plus" data-key="${key}">+</button>
      </div>
    </div>

    <button class="cook-btn" id="cookBtn-${key}" data-key="${key}"><span class="ic">🔄</span>${UI.cookModeEnable[lang]}</button>

    <div class="section-label">${UI.sectionIngredients[lang]}</div>
    <div class="ing-list">
      ${r.ingredients.map(ing=>`
        <div class="ing-row">
          <div class="name">${ing[lang]}<small>${ing.prod[lang]}</small></div>
          <div class="qty">${fmt(ing.base*factor)}<span class="unit">${UNITS[ing.unit][lang]}</span></div>
        </div>
      `).join("")}
    </div>
    ${r.ingredients.some(ing=>ing[lang].trim().endsWith("*")) ? `<p class="ing-sub-legend">${UI.ingSubLegend[lang]}</p>` : ""}
  `;

  if(r.extraNote){
    html += `<p class="recipe-tag" style="margin-top:8px;">${r.extraNote[lang]}</p>`;
  }

  if(r.equipment){
    html += `
      <div class="section-label">${UI.sectionEquipment[lang]}</div>
      <ul class="eq-list">
        ${r.equipment[lang].map(e=>`<li>${e}</li>`).join("")}
      </ul>
    `;
  }

  html += `<div class="section-label">${UI.sectionMethod[lang]}</div>`;
  html += `<ol class="steps">`;
  r.steps[lang].forEach(s=>{
    if(typeof s === "object" && s.head){
      html += `<li class="head">${s.head}</li>`;
    } else if(typeof s === "object" && s.t){
      html += `<li><strong>${s.t}</strong><br>${s.d}</li>`;
    } else {
      html += `<li>${s}</li>`;
    }
  });
  html += `</ol>`;

  if(r.note){
    html += `<div class="note key">${r.note[lang]}</div>`;
  }
  if(r.note2){
    html += `<div class="note">${r.note2[lang]}</div>`;
  }
  if(r.note3){
    html += `<div class="note">${r.note3[lang]}</div>`;
  }

  if(r.nutrition){
    const n100 = r.nutrition.per100;
    const nUnit = r.nutrition.perUnit;
    const total = {};
    Object.keys(nUnit).forEach(k=> total[k] = nUnit[k] * desired[key]);
    const rnd1 = v => Math.round(v*10)/10;
    html += `
      <div class="section-label">${UI.sectionNutrition[lang]}</div>
      <table class="nutri-table">
        <thead>
          <tr><th></th><th>${UI.nutriPer100[lang]}</th><th>${UI.nutriPerPortionTotal[lang]}</th></tr>
        </thead>
        <tbody>
          <tr><td>${UI.nutriEnergy[lang]}</td><td>${rnd1(n100.kcal)} kcal</td><td>${rnd1(total.kcal)} kcal</td></tr>
          <tr><td>${UI.nutriProtein[lang]}</td><td>${rnd1(n100.protein)} g</td><td>${rnd1(total.protein)} g</td></tr>
          <tr><td>${UI.nutriCarbs[lang]}</td><td>${rnd1(n100.carbs)} g</td><td>${rnd1(total.carbs)} g</td></tr>
          <tr><td class="sub">${UI.nutriSugars[lang]}</td><td>${rnd1(n100.sugars)} g</td><td>${rnd1(total.sugars)} g</td></tr>
          <tr><td>${UI.nutriFat[lang]}</td><td>${rnd1(n100.fat)} g</td><td>${rnd1(total.fat)} g</td></tr>
          <tr><td class="sub">${UI.nutriSat[lang]}</td><td>${rnd1(n100.sat)} g</td><td>${rnd1(total.sat)} g</td></tr>
          <tr><td>${UI.nutriFiber[lang]}</td><td>${rnd1(n100.fiber)} g</td><td>${rnd1(total.fiber)} g</td></tr>
        </tbody>
      </table>
      <p class="recipe-tag" style="margin-top:6px;">${UI.nutriDisclaimer[lang]}</p>
    `;
  }

  panel.innerHTML = html;

  panel.querySelectorAll("button[data-act]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = btn.dataset.key;
      const rc = recipes[k];
      if(btn.dataset.act === "plus") desired[k] = Math.min(rc.max, desired[k] + rc.step);
      else desired[k] = Math.max(rc.min, desired[k] - rc.step);
      renderRecipe(k);
    });
  });
  const inp = panel.querySelector(`#input-${key}`);
  inp.addEventListener("change", ()=>{
    const rc = recipes[key];
    let v = parseFloat(inp.value);
    if(isNaN(v)) v = rc.baseCount;
    v = Math.min(rc.max, Math.max(rc.min, v));
    desired[key] = v;
    renderRecipe(key);
  });

  const cookBtn = panel.querySelector(`#cookBtn-${key}`);
  if(cookBtn) cookBtn.addEventListener("click", ()=> openCookMode(key));
}

  divers:      {fr:"Divers",                   en:"Other",               de:"Sonstiges",                    th:"เบ็ดเตล็ด"},
};

function coursesStripAccents(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function coursesNormalizeName(s){
  let n = s.replace(/œ/g, "oe").replace(/Œ/g, "OE").replace(/æ/g, "ae").replace(/Æ/g, "AE");
  n = coursesStripAccents(n).toLowerCase().trim();
  n = n.replace(/\s*\*\s*$/, ""); // retire l'astérisque de fin (marqueur "ingrédient rare")
  return n;
}
function coursesHasWord(normalized, word){
  const esc = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return new RegExp("(^|[^a-z])" + esc + "([^a-z]|$)").test(normalized);
}
function coursesClassifyFamily(nameFr){
  const n = coursesNormalizeName(nameFr);
  const has = (...words) => words.some(w => coursesHasWord(n, w));
  if(has("carotte","carottes","oignon","oignons","champignon","champignons","courgette","courgettes","tomate","tomates","navet","navets","pomme","pommes","poireau","celeri","chou","legume","legumes","ail")) return "legumes";
  if(has("boeuf","veau","poulet","merguez","lardon","lardons","viande","porc","agneau","jambon","saucisse","saucisses")) return "viandes";
  if(has("beurre","lait","creme","fromage","yaourt","oeuf","oeufs")) return "laitier";
  if(has("farine","levure","bicarbonate","agent","flour","baking","yeast","soda","t65","t45","t55","t80")) return "farines";
  if(has("sucre","vanille","miel")) return "sucres";
  if(has("sel","poivre","epice","epices","paprika","cumin","curcuma","harissa","hanout","muscade","cannelle")) return "epices";
  if(has("thym","laurier","persil","coriandre","bouquet","basilic","menthe","herbe","herbes")) return "herbes";
  if(has("raisin","raisins","amande","amandes","noix","pignon","pignons")) return "fruits_secs";
  if(has("semoule","pois","bouillon","concentre","huile","eau","rhum","vin","citron")) return "epicerie";
  return "divers";
}

function defaultCoursesList(){
  const seen = new Map(); // clé normalisée -> item dédoublonné

  function addName(nameObj){
    const key = coursesNormalizeName(nameObj.fr);
    if(!key || seen.has(key)) return;
    seen.set(key, {
      id: "item-" + key.replace(/[^a-z0-9]+/g, "_").slice(0, 60),
      name: nameObj,
      family: coursesClassifyFamily(nameObj.fr),
      checked: false,
      manual: false
    });
  }

  inventaire.forEach(group=>{
    if(group.cat.fr === "Équipement") return; // pas un ingrédient de courses
    group.items.forEach(it=>{
      addName({fr: it.p, en: it.p, de: it.p, th: it.p});
    });
  });

  Object.keys(recipes).forEach(key=>{
    recipes[key].ingredients.forEach(ing=>{
      addName({fr: ing.fr, en: ing.en, de: ing.de, th: ing.th});
    });
  });

  return Array.from(seen.values());
}

let coursesList = [];
let coursesLastSaved = null;

function coursesLoadCurrent(){
  try{
    const raw = localStorage.getItem(COURSES_CURRENT_KEY);
    if(raw){
      const data = JSON.parse(raw);
      coursesList = data.list || defaultCoursesList();
      coursesLastSaved = data.savedAt || null;
      return;
    }
  }catch(e){}
  coursesList = defaultCoursesList();
  coursesLastSaved = null;
}

function coursesPersistCurrent(){
  try{
    localStorage.setItem(COURSES_CURRENT_KEY, JSON.stringify({list: coursesList, savedAt: coursesLastSaved}));
  }catch(e){}
}

function coursesNowLabel(lang){
  const locale = lang==="fr" ? "fr-FR" : lang==="de" ? "de-DE" : lang==="th" ? "th-TH" : "en-US";
  const d = new Date();
  return d.toLocaleDateString(locale, {day:"2-digit", month:"2-digit", year:"numeric"}) + " " + d.toLocaleTimeString(locale, {hour:"2-digit", minute:"2-digit"});
}

    ? UI.coursesSavedOn[lang] + coursesLastSaved
    : UI.coursesNeverSaved[lang];

  const root = document.getElementById("coursesContent");
  root.innerHTML = "";

  // Regrouper par famille (ordre "vraie vie"), articles manuels à la fin
  const byFam = {};
  coursesList.forEach(item=>{
    const key = item.manual ? "__manual__" : item.family;
    if(!byFam[key]) byFam[key] = [];
    byFam[key].push(item);
  });

  const orderedKeys = [...COURSES_FAMILY_ORDER.filter(k=>byFam[k]), ...(byFam["__manual__"] ? ["__manual__"] : [])];

  orderedKeys.forEach(key=>{
    const catEl = document.createElement("div");
    catEl.className = "courses-cat";
    catEl.textContent = key === "__manual__" ? UI.coursesManualCat[lang] : COURSES_FAMILIES[key][lang];
    root.appendChild(catEl);

    byFam[key].forEach(item=>{
      const row = document.createElement("div");
      row.className = "courses-item" + (item.checked ? " checked" : "");
      const nameText = typeof item.name === "string" ? item.name : item.name[lang];
      const thText = (!item.manual && lang !== "th" && typeof item.name === "object") ? item.name.th : "";
      const qtyText = item.manual ? (item.qty || "") : "";
      row.innerHTML = `
        <div class="courses-check" data-id="${item.id}">${item.checked ? "✓" : ""}</div>
        <div class="courses-info" data-id="${item.id}">

    el.addEventListener("click", ()=>{
      const id = el.dataset.id;
      const it = coursesList.find(x=>x.id===id);
      if(it){ it.checked = !it.checked; coursesPersistCurrent(); renderCourses(); }
    });
  });
  root.querySelectorAll(".courses-del").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.dataset.id;
      coursesList = coursesList.filter(x=>x.id!==id);
      coursesPersistCurrent();
      renderCourses();
    });
  });

  history.unshift({
    id: "snap-" + Date.now(),
    savedAt: coursesLastSaved,
    list: JSON.parse(JSON.stringify(coursesList))
  });

  try{ localStorage.setItem(COURSES_HISTORY_KEY, JSON.stringify(history)); }catch(e){}

  renderCourses();
  coursesToast(UI.coursesSavedToast[lang]);

function coursesOpenHistory(){
  const lang = currentLang;
  document.getElementById("coursesHistoryModalTitle").textContent = UI.coursesHistoryTitle[lang];
  let history = [];
  try{ history = JSON.parse(localStorage.getItem(COURSES_HISTORY_KEY) || "[]"); }catch(e){}
  const root = document.getElementById("coursesHistoryList");
  root.innerHTML = "";
  if(history.length === 0){
    root.innerHTML = `<p style="font-size:13.5px; color:var(--walnut-soft);">${UI.coursesHistoryEmpty[lang]}</p>`;
  } else {
    history.forEach(snap=>{
      const nChecked = snap.list.filter(x=>x.checked).length;
      const row = document.createElement("div");
      row.className = "courses-history-row";
      row.innerHTML = `
        <div class="chr-date">${snap.savedAt}<span class="chr-count">${nChecked}/${snap.list.length}</span></div>
        <button class="chr-load" data-id="${snap.id}">${UI.coursesHistoryLoad[lang]}</button>
        <button class="chr-del" data-id="${snap.id}">${UI.coursesHistoryDelete[lang]}</button>
      `;
      root.appendChild(row);
    });
    root.querySelectorAll(".chr-load").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const snap = history.find(s=>s.id===btn.dataset.id);
        if(snap){
          coursesList = JSON.parse(JSON.stringify(snap.list));
          coursesPersistCurrent();
          renderCourses();
          document.getElementById("coursesHistoryModal").classList.remove("show");
        }
      });
    });
    root.querySelectorAll(".chr-del").forEach(btn=>{

        try{ localStorage.setItem(COURSES_HISTORY_KEY, JSON.stringify(history)); }catch(e){}
        coursesOpenHistory();
      });
    });

  document.getElementById("coursesHistoryModal").classList.add("show");

function coursesExportText(){
  const lang = currentLang;

  if(navigator.share){
    const header = UI.coursesExportHeader[lang] + " — " + coursesNowLabel(lang);
    const nameOf = it => {
      if(typeof it.name === "string") return it.name;
      const main = it.name[lang];
      const th = (!it.manual && lang !== "th") ? it.name.th : "";
      return th ? main + " / " + th : main;
    };
    const byFam = {};
    coursesList.forEach(item=>{
      const key = item.manual ? "__manual__" : item.family;
      if(!byFam[key]) byFam[key] = [];
      byFam[key].push(item);
    });
    const orderedKeys = [...COURSES_FAMILY_ORDER.filter(k=>byFam[k]), ...(byFam["__manual__"] ? ["__manual__"] : [])];
    let txt = header + "\n\n";
    orderedKeys.forEach(key=>{
      const famLabel = key === "__manual__" ? UI.coursesManualCat[lang] : COURSES_FAMILIES[key][lang];
      txt += famLabel.toUpperCase() + "\n";
      byFam[key].forEach(it=>{
        const qtyText = it.manual && it.qty ? " — " + it.qty : "";
        txt += (it.checked ? "☑ " : "☐ ") + nameOf(it) + qtyText + "\n";
      });
      txt += "\n";
    });
    navigator.share({title: UI.coursesExportHeader[lang], text: txt}).catch(()=>{});
  } else {
    const html = coursesBuildExportHtml(lang);
    const blob = new Blob([html], {type:"text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "liste_courses_" + new Date().toISOString().slice(0,10) + ".html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 3000);
  }
}

/* ===================== MODE CUISINE (pas-à-pas + retournement) ===================== */
const cook = {
  active:false,
  key:null,
  idx:0,
  steps:[],       // liste à plat : {section, title, desc}
  motionOn:false,
  motionReady:false,
  permissionDenied:false,
  refVec:null,
  lastFlip:0,
  scale:1,
  wakeLock:null,
};

function buildCookSteps(key, lang){
  const r = recipes[key];
  const flat = [];
  let section = null;
  r.steps[lang].forEach(s=>{
    if(typeof s === "object" && s.head){
      section = s.head;
    } else if(typeof s === "object" && s.t){
      flat.push({section, title:s.t, desc:s.d});
    } else {
      flat.push({section, title:null, desc:s});
    }
  });
  return flat;
}

function openCookMode(key){
  cook.active = true;
  cook.key = key;
  cook.idx = 0;
  cook.steps = buildCookSteps(key, currentLang);
  document.body.classList.add("cook-mode-active");
  document.getElementById("cookOverlay").classList.add("show");
  document.getElementById("cookOverlay").style.setProperty("--cook-scale", cook.scale);
  renderCookStep();
  enableFlipDetection();
  enterCookFullscreen();
  requestCookWakeLock();
}

function closeCookMode(){
  cook.active = false;
  document.body.classList.remove("cook-mode-active");
  document.getElementById("cookOverlay").classList.remove("show");
  exitCookFullscreen();
  releaseCookWakeLock();
}

function cookNav(dir){
  const max = cook.steps.length; // steps.length == écran "terminé"
  cook.idx = Math.min(max, Math.max(0, cook.idx + dir));
  renderCookStep();
}

function cookGoNext(){
  if(cook.idx >= cook.steps.length){ closeCookMode(); return; } // déjà sur l'écran "terminé"
  cookNav(1);
}

function renderCookStep(){
  const lang = currentLang;
  const r = recipes[cook.key];
  const total = cook.steps.length;
  const i = cook.idx;

  document.getElementById("cookRecipeName").textContent = r.title[lang];
  document.getElementById("cookStepCount").textContent =
    `${UI.cookModeStepLabel[lang]} ${Math.min(i+1,total)} ${UI.cookModeOf[lang]} ${total}`;

  const progress = document.getElementById("cookProgress");
  progress.innerHTML = "";
  cook.steps.forEach((_, idx)=>{
    const d = document.createElement("div");
    d.className = "dot" + (idx < i ? " done" : idx === i ? " current" : "");
    progress.appendChild(d);
  });

  const body = document.getElementById("cookBody");
  if(i >= total){
    body.innerHTML = `<div class="cook-done">${UI.cookModeDone[lang]}</div>`;
  } else {
    const st = cook.steps[i];
    body.innerHTML = `
      <div class="cook-col-left">
        ${st.section ? `<div class="cook-section">${st.section}</div>` : ""}
        ${st.title ? `<div class="cook-title">${st.title}</div>` : ""}
      </div>
      <div class="cook-col-right">
        <div class="cook-desc">${st.desc}</div>
      </div>
    `;
  }

  const hint = document.getElementById("cookHint");
  let flipLine;
  if(cook.motionOn){
    flipLine = `<span class="ic">📱</span> ${UI.cookModeHintFlip[lang]}`;
    hint.classList.add("pulse");
  } else if(cook.permissionDenied){
    flipLine = UI.cookModePermissionDenied[lang];
    hint.classList.remove("pulse");
  } else {
    flipLine = UI.cookModeHintNoSensor[lang];
    hint.classList.remove("pulse");
  }
  hint.innerHTML = `${flipLine}<span class="tap-hint">${UI.cookModeHintTap[lang]}</span>`;

  const prevBtn = document.getElementById("cookPrev");
  const nextBtn = document.getElementById("cookNext");
  prevBtn.textContent = UI.cookModePrev[lang];
  prevBtn.disabled = (i <= 0);
  if(i >= total - 1){
    nextBtn.textContent = UI.cookModeFinish[lang];
  } else {
    nextBtn.textContent = UI.cookModeNext[lang];
  }
  nextBtn.disabled = false;
}

document.getElementById("cookClose").addEventListener("click", closeCookMode);
document.getElementById("cookPrev").addEventListener("click", ()=> cookNav(-1));
document.getElementById("cookNext").addEventListener("click", cookGoNext);

/* ---- toucher l'écran pour avancer aussi (mains libres en secours) ---- */
document.getElementById("cookBody").addEventListener("click", cookGoNext);

/* ---- taille du texte ajustable ---- */
function adjustCookScale(delta){
  cook.scale = Math.min(1.6, Math.max(0.8, Math.round((cook.scale + delta) * 10) / 10));
  document.getElementById("cookOverlay").style.setProperty("--cook-scale", cook.scale);
}
document.getElementById("cookTextSmaller").addEventListener("click", e=>{
  e.stopPropagation();
  adjustCookScale(-0.1);
});
document.getElementById("cookTextBigger").addEventListener("click", e=>{
  e.stopPropagation();
  adjustCookScale(0.1);
});

/* ---- plein écran automatique ---- */
function enterCookFullscreen(){
  try{
    const el = document.getElementById("cookOverlay");
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){
      const p = req.call(el);
      if(p && p.catch) p.catch(()=>{});
    }
  }catch(e){}
}
function exitCookFullscreen(){
  try{
    if(document.fullscreenElement || document.webkitFullscreenElement){
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(exit){
        const p = exit.call(document);
        if(p && p.catch) p.catch(()=>{});
      }
    }
  }catch(e){}
}

/* ---- écran qui reste allumé ---- */
async function requestCookWakeLock(){
  try{
    if("wakeLock" in navigator){
      cook.wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){ /* pas bloquant si refusé/non supporté */ }
}
function releaseCookWakeLock(){
  if(cook.wakeLock){
    cook.wakeLock.release().catch(()=>{});
    cook.wakeLock = null;
  }
}
document.addEventListener("visibilitychange", ()=>{
  if(cook.active && document.visibilityState === "visible") requestCookWakeLock();
});

/* ---- détection du retournement (vecteur de gravité) ---- */
function handleMotion(evt){
  const g = evt.accelerationIncludingGravity;
  if(!g || g.x === null || g.x === undefined) return;
  const x = g.x, y = g.y, z = g.z;
  const mag = Math.sqrt(x*x + y*y + z*z);
  if(mag < 4) return; // lecture trop faible / bruit
  const v = {x:x/mag, y:y/mag, z:z/mag};

  if(!cook.refVec){ cook.refVec = v; return; }

  const now = Date.now();
  const dot = v.x*cook.refVec.x + v.y*cook.refVec.y + v.z*cook.refVec.z;

  if(dot < -0.5 && (now - cook.lastFlip) > 900){
    cook.lastFlip = now;
    cook.refVec = v;
    if(cook.active && cook.idx < cook.steps.length){
      cook.idx++;
      renderCookStep();
    }
    return;
  }

  // recalage lent (dérive naturelle) sauf juste après un flip
  if(now - cook.lastFlip > 900){
    cook.refVec = {
      x: cook.refVec.x*0.95 + v.x*0.05,
      y: cook.refVec.y*0.95 + v.y*0.05,
      z: cook.refVec.z*0.95 + v.z*0.05,
    };
  }
}

function enableFlipDetection(){
  if(cook.motionOn) return; // déjà actif
  if(typeof DeviceMotionEvent === "undefined"){
    cook.motionOn = false;
    renderCookStep();
    return;
  }
  if(typeof DeviceMotionEvent.requestPermission === "function"){
    DeviceMotionEvent.requestPermission().then(state=>{
      if(state === "granted"){
        cook.motionOn = true;
        cook.permissionDenied = false;
        window.addEventListener("devicemotion", handleMotion);
      } else {
        cook.motionOn = false;
        cook.permissionDenied = true;
      }
      renderCookStep();
    }).catch(()=>{
      cook.motionOn = false;
      cook.permissionDenied = true;
      renderCookStep();
    });
  } else {
    cook.motionOn = true;
    window.addEventListener("devicemotion", handleMotion);
    renderCookStep();
  }
}

/* ===================== INIT ===================== */
refreshStaticText();
renderInventaire();
</script>
